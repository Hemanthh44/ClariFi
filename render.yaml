### Optional Render Blueprint.
#
# Not required — you can just create a Web Service + PostgreSQL instance by
# hand in the Render dashboard (see backend/README.md for the click-by-click
# steps). This file lets you create both with "New +" -> "Blueprint" instead,
# if you'd rather have Render read the config from the repo.
#
# Secrets (GEMINI_API_KEY, TAVILY_API_KEY, R2_*) are intentionally left as
# `sync: false` so Render prompts you for them in the dashboard instead of
# storing them in this file.

services:
  - type: web
    name: clarifi-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: clarifi-postgres
          property: connectionString
      - key: CLARIFI_ENVIRONMENT
        value: production
      - key: CLARIFI_FRONTEND_ORIGIN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CLARIFI_LLM_MODEL
        value: gemini-2.5-flash-lite
      - key: TAVILY_API_KEY
        sync: false
      - key: CLARIFI_TAVILY_MAX_RESULTS
        value: "6"
      - key: R2_ENDPOINT_URL
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_PUBLIC_BASE_URL
        sync: false

databases:
  - name: clarifi-postgres
    plan: free
